[project]
name = "scilint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "archie955", email = "archiesmedley604@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
]
line-length = 88
indent-width = 4
target-version = "py314"



[tool.ruff.lint]
select = [
    # pycodestyle errors
    "E",

    # pyflakes
    "F",

    # import sorting
    "I",

    # flake8 bugbear
    "B",

    # pyugrade
    "UP",

    # pydocstyle
    "D",

    # pep8 naming
    "N",

    # flake8 bandit
    "S",

    # flake8 trailing comma
    "COM",

    # flake8 comprehensions
    "C4",

    # flake8 logging
    "LOG",
    "G",

    # flake8 print
    "T",

    # flake8 simplify
    "SIM",
    
    # flake8 async
    "ASYNC",

    # mccabe complexity
    "C90",

    # FastAPI response models, Annotation, path params
    "FAST",

    # flake8 2020
    "YTT",

    # flake8 blind except
    "BLE",

    # flake8 datetime
    "DTZ",

    # flake8 debugger
    "T10",

    # flake8 executable
    "EXE",

    # flake8 future Annotation
    "FA",

    # flake8 get text
    "INT",

    # flake8 implicit string concat
    "ISC",

    # flake8 pie
    "PIE",

    # flake8 pytest style
    "PT",

    # flake8 return
    "RET",

    # flake8 type checking
    "TC",

    # flake8 pathlib
    "PTH",

    # flynt
    "FLY",

    # perflint
    "PERF",

    # pycodestyle warnings
    "W",

    # pygrep hooks
    "PGH",

    # pylint
    "PL",

    # refurb
    "FURB",
    
    # ruff specific rules
    "RUF",

    # Tryceratops
    "TRY",
]

ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "logging-f-string",
    "missing-blank-line-after-summary",
]
preview = true
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = [
    "assert",
    "magic-value-comparison",
    "D",
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
    "float-equality-comparison",
    "hardcoded-password-default"
]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"


[tool.pyrefly]
project-includes = [
    "**/*.py",
]
project-excludes = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "/tests/*",
    "tests"
]
python-platform = "linux"
python-version = "3.14"
preset = "strict"